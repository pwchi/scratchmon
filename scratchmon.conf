# /etc/scratchmon.conf
# HPC Scratch 空間監控設定檔
# 修改此檔即可調整監控對象與門檻，不需要改動 script 本身

# 要監控的掛載點「路徑」(注意：用路徑而非裝置名稱/UUID，
# 因為底層裝置在儲存系統更換或重新掛載時可能改變，但掛載點路徑通常維持不變)
# 若留空 "", script 會自動尋找路徑中含 "scratch" 字樣的掛載點
SCRATCH_MOUNT="/scratch"

# 觸發整體使用率警告的門檻 (百分比整數)
THRESHOLD=80

# df 查詢逾時秒數。
# 這是「登入當下」直接查詢，逾時秒數就是檔案系統異常時
# 使用者登入最多會被拖慢的秒數，建議設短 (2~3 秒)，
# 抓不到資料時直接放棄顯示，不要讓使用者等太久。
DF_TIMEOUT=3

# 是否啟用登入時的動態進度條效果 (1=啟用 0=停用)
ANIMATION=1

# df 逾時或失敗時，是否記錄到 syslog (方便管理者事後追查是否
# scratch 檔案系統常態性異常)。1=啟用 0=停用
LOG_FAILURES=1

# ---- 個人用量顯示 (lfs quota) ----
# 是否顯示登入使用者自己在 scratch 上的用量 (需要 Lustre + lfs 指令)
# 若 SCRATCH_MOUNT 不是 Lustre 檔案系統，或找不到 lfs 指令，
# 會自動略過此功能，不會顯示錯誤訊息。1=啟用 0=停用
SHOW_USER_QUOTA=1

# lfs quota 查詢逾時秒數 (獨立於 DF_TIMEOUT，因為 lfs quota
# 在某些叢集上可能比一般 df 慢)
LFS_TIMEOUT=5
